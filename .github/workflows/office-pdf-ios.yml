name: Office PDF iOS candidate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe 探测；build 完整构建；inspect-run7 只读取证受信SW原件'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - build
          - inspect-run7
permissions:
  contents: read
concurrency:
  group: office-pdf-ios-kernel
  cancel-in-progress: false
jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: 获取已选仓库的候选源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 校验并恢复纯文本内核源码
        run: python3 restore-source.py --manifest kernel-source.json --destination .
      - name: 校验源码传输边界
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/test_sources.py
      - name: 标准 runner 预检
        timeout-minutes: 5
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/run.py --mode probe --work "$RUNNER_TEMP/office-pdf-ios"
      - name: 保留预检证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-pdf-ios-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/office-pdf-ios/evidence/logs
          if-no-files-found: warn
          retention-days: 1
  tools:
    if: inputs.mode == 'build'
    runs-on: macos-15-intel
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    outputs:
      cache_key: ${{ steps.phase.outputs.cache_key }}
      payload_sha: ${{ steps.phase.outputs.payload_sha }}
      manifest_sha: ${{ steps.phase.outputs.manifest_sha }}
    steps:
      - name: 获取已选仓库的候选源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 校验并恢复纯文本内核源码
        run: python3 restore-source.py --manifest kernel-source.json --destination .
      - name: 校验源码传输边界
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/test_sources.py
      - name: 官方完整图阶段 tools
        id: phase
        timeout-minutes: 325
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/run.py --mode build --phase tools --work "$RUNNER_TEMP/office-pdf-ios" --cache "$RUNNER_TEMP/office-pdf-checkpoint"
      - name: 保存当前成功阶段或最终候选的免费缓存
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
      - name: 核验缓存已实际持久化
        id: persisted_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: 缓存持久化必须精确命中
        env:
          CACHE_HIT: ${{ steps.persisted_cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.phase.outputs.cache_key }}
        run: |
          test "$CACHE_HIT" = true
          python3 -c 'import json,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"cacheHit": True, "cacheKey": os.environ["CACHE_KEY"], "stage": "tools"}, indent=2)+"\n")' "$RUNNER_TEMP/office-pdf-ios/evidence/logs/CACHE-PERSISTENCE.json"
      - name: 保留阶段证据（不含构建检查点）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-pdf-ios-build-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/office-pdf-ios/evidence/logs
          if-no-files-found: warn
          retention-days: 1
  vcl:
    if: inputs.mode == 'build'
    needs: tools
    runs-on: macos-15-intel
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PREVIOUS_PAYLOAD_SHA: ${{ needs.tools.outputs.payload_sha }}
      PREVIOUS_MANIFEST_SHA: ${{ needs.tools.outputs.manifest_sha }}
    outputs:
      cache_key: ${{ steps.phase.outputs.cache_key }}
      payload_sha: ${{ steps.phase.outputs.payload_sha }}
      manifest_sha: ${{ steps.phase.outputs.manifest_sha }}
    steps:
      - name: 获取已选仓库的候选源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 校验并恢复纯文本内核源码
        run: python3 restore-source.py --manifest kernel-source.json --destination .
      - name: 校验源码传输边界
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/test_sources.py
      - name: 精确恢复前一成功阶段的免费缓存
        id: restored_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ needs.tools.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: 拒绝缓存前缀匹配
        env:
          CACHE_HIT: ${{ steps.restored_cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 官方完整图阶段 vcl
        id: phase
        timeout-minutes: 325
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/run.py --mode build --phase vcl --work "$RUNNER_TEMP/office-pdf-ios" --cache "$RUNNER_TEMP/office-pdf-checkpoint" --payload-sha "$PREVIOUS_PAYLOAD_SHA" --manifest-sha "$PREVIOUS_MANIFEST_SHA"
      - name: 保存当前成功阶段或最终候选的免费缓存
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
      - name: 核验缓存已实际持久化
        id: persisted_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: 缓存持久化必须精确命中
        env:
          CACHE_HIT: ${{ steps.persisted_cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.phase.outputs.cache_key }}
        run: |
          test "$CACHE_HIT" = true
          python3 -c 'import json,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"cacheHit": True, "cacheKey": os.environ["CACHE_KEY"], "stage": "vcl"}, indent=2)+"\n")' "$RUNNER_TEMP/office-pdf-ios/evidence/logs/CACHE-PERSISTENCE.json"
      - name: 保留阶段证据（不含构建检查点）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-pdf-ios-build-vcl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/office-pdf-ios/evidence/logs
          if-no-files-found: warn
          retention-days: 1
  sd:
    if: inputs.mode == 'build'
    needs: vcl
    runs-on: macos-15-intel
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PREVIOUS_PAYLOAD_SHA: ${{ needs.vcl.outputs.payload_sha }}
      PREVIOUS_MANIFEST_SHA: ${{ needs.vcl.outputs.manifest_sha }}
    outputs:
      cache_key: ${{ steps.phase.outputs.cache_key }}
      payload_sha: ${{ steps.phase.outputs.payload_sha }}
      manifest_sha: ${{ steps.phase.outputs.manifest_sha }}
    steps:
      - name: 获取已选仓库的候选源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 校验并恢复纯文本内核源码
        run: python3 restore-source.py --manifest kernel-source.json --destination .
      - name: 校验源码传输边界
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/test_sources.py
      - name: 精确恢复前一成功阶段的免费缓存
        id: restored_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ needs.vcl.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: 拒绝缓存前缀匹配
        env:
          CACHE_HIT: ${{ steps.restored_cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 官方完整图阶段 sd
        id: phase
        timeout-minutes: 325
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/run.py --mode build --phase sd --work "$RUNNER_TEMP/office-pdf-ios" --cache "$RUNNER_TEMP/office-pdf-checkpoint" --payload-sha "$PREVIOUS_PAYLOAD_SHA" --manifest-sha "$PREVIOUS_MANIFEST_SHA"
      - name: 保存当前成功阶段或最终候选的免费缓存
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
      - name: 核验缓存已实际持久化
        id: persisted_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: 缓存持久化必须精确命中
        env:
          CACHE_HIT: ${{ steps.persisted_cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.phase.outputs.cache_key }}
        run: |
          test "$CACHE_HIT" = true
          python3 -c 'import json,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"cacheHit": True, "cacheKey": os.environ["CACHE_KEY"], "stage": "sd"}, indent=2)+"\n")' "$RUNNER_TEMP/office-pdf-ios/evidence/logs/CACHE-PERSISTENCE.json"
      - name: 保留阶段证据（不含构建检查点）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-pdf-ios-build-sd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/office-pdf-ios/evidence/logs
          if-no-files-found: warn
          retention-days: 1
  sw:
    if: inputs.mode == 'build'
    needs: sd
    runs-on: macos-15-intel
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PREVIOUS_PAYLOAD_SHA: ${{ needs.sd.outputs.payload_sha }}
      PREVIOUS_MANIFEST_SHA: ${{ needs.sd.outputs.manifest_sha }}
    outputs:
      cache_key: ${{ steps.phase.outputs.cache_key }}
      payload_sha: ${{ steps.phase.outputs.payload_sha }}
      manifest_sha: ${{ steps.phase.outputs.manifest_sha }}
    steps:
      - name: 获取已选仓库的候选源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 校验并恢复纯文本内核源码
        run: python3 restore-source.py --manifest kernel-source.json --destination .
      - name: 校验源码传输边界
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/test_sources.py
      - name: 精确恢复前一成功阶段的免费缓存
        id: restored_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ needs.sd.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: 拒绝缓存前缀匹配
        env:
          CACHE_HIT: ${{ steps.restored_cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 官方完整图阶段 sw
        id: phase
        timeout-minutes: 325
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/run.py --mode build --phase sw --work "$RUNNER_TEMP/office-pdf-ios" --cache "$RUNNER_TEMP/office-pdf-checkpoint" --payload-sha "$PREVIOUS_PAYLOAD_SHA" --manifest-sha "$PREVIOUS_MANIFEST_SHA"
      - name: 保存当前成功阶段或最终候选的免费缓存
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
      - name: 核验缓存已实际持久化
        id: persisted_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: 缓存持久化必须精确命中
        env:
          CACHE_HIT: ${{ steps.persisted_cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.phase.outputs.cache_key }}
        run: |
          test "$CACHE_HIT" = true
          python3 -c 'import json,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"cacheHit": True, "cacheKey": os.environ["CACHE_KEY"], "stage": "sw"}, indent=2)+"\n")' "$RUNNER_TEMP/office-pdf-ios/evidence/logs/CACHE-PERSISTENCE.json"
      - name: 保留阶段证据（不含构建检查点）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-pdf-ios-build-sw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/office-pdf-ios/evidence/logs
          if-no-files-found: warn
          retention-days: 1
  final:
    if: inputs.mode == 'build'
    needs: sw
    runs-on: macos-15-intel
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PREVIOUS_PAYLOAD_SHA: ${{ needs.sw.outputs.payload_sha }}
      PREVIOUS_MANIFEST_SHA: ${{ needs.sw.outputs.manifest_sha }}
    outputs:
      cache_key: ${{ steps.phase.outputs.cache_key }}
      payload_sha: ${{ steps.phase.outputs.payload_sha }}
      manifest_sha: ${{ steps.phase.outputs.manifest_sha }}
    steps:
      - name: 获取已选仓库的候选源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 校验并恢复纯文本内核源码
        run: python3 restore-source.py --manifest kernel-source.json --destination .
      - name: 校验源码传输边界
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/test_sources.py
      - name: 精确恢复前一成功阶段的免费缓存
        id: restored_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ needs.sw.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: 拒绝缓存前缀匹配
        env:
          CACHE_HIT: ${{ steps.restored_cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 官方完整图阶段 final
        id: phase
        timeout-minutes: 325
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/run.py --mode build --phase final --work "$RUNNER_TEMP/office-pdf-ios" --cache "$RUNNER_TEMP/office-pdf-checkpoint" --payload-sha "$PREVIOUS_PAYLOAD_SHA" --manifest-sha "$PREVIOUS_MANIFEST_SHA"
      - name: 保存当前成功阶段或最终候选的免费缓存
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
      - name: 核验缓存已实际持久化
        id: persisted_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: ${{ steps.phase.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: 缓存持久化必须精确命中
        env:
          CACHE_HIT: ${{ steps.persisted_cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.phase.outputs.cache_key }}
        run: |
          test "$CACHE_HIT" = true
          python3 -c 'import json,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"cacheHit": True, "cacheKey": os.environ["CACHE_KEY"], "stage": "final"}, indent=2)+"\n")' "$RUNNER_TEMP/office-pdf-ios/evidence/logs/CACHE-PERSISTENCE.json"
      - name: 保留阶段证据（不含构建检查点）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-pdf-ios-build-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/office-pdf-ios/evidence/logs
          if-no-files-found: warn
          retention-days: 1
  inspect_run7:
    if: inputs.mode == 'inspect-run7'
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: 获取已选仓库的取证源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 校验并恢复纯文本内核源码
        run: python3 restore-source.py --manifest kernel-source.json --destination .
      - name: 校验源码传输和取证边界
        run: |
          python3 native-kernels/lizhao-office-pdf-ios/ci/test_sources.py
          python3 native-kernels/lizhao-office-pdf-ios/ci/test_inspect_link.py
      - name: 仅取回已核验的第7轮SW缓存
        id: inspection_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          # cache版本含path；与原SW保存路径逐字相同，禁止换目录借前缀恢复。
          path: ${{ runner.temp }}/office-pdf-checkpoint
          key: office-pdf-ios-checkpoint-v1-caef5abbbd500cf0e8feb2d6c08c8777bcfb2c0cfa89c52d200ce60a083714a2-sw
          fail-on-cache-miss: true
      - name: 拒绝缓存前缀匹配
        env:
          CACHE_HIT: ${{ steps.inspection_cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 只读采集已存在的对象与引用
        run: python3 native-kernels/lizhao-office-pdf-ios/ci/inspect_link.py --work "$RUNNER_TEMP/office-pdf-ios" --cache "$RUNNER_TEMP/office-pdf-checkpoint" --evidence "$RUNNER_TEMP/office-pdf-inspect-evidence"
      - name: 保留有界取证JSON与日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-pdf-ios-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/office-pdf-inspect-evidence
          if-no-files-found: warn
          retention-days: 1
